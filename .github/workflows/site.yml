name: Check and publish resource website

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'pages-production' || format('site-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out this repository only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate catalog, synchronize checks, and build
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          git diff --quiet HEAD --
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/site.py --check --base-ref "$BASE_SHA"
          else
            python3 scripts/site.py --check
          fi
      - name: Test synchronization boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test browsing and copy behavior
        run: node --test tests/core.test.cjs
      - name: Save a review artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: _site/
          retention-days: 7
      - name: Package production Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this artifact still represents current master
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote --exit-code "https://github.com/$REPOSITORY.git" refs/heads/master | cut -f1)
          if [ -z "$current" ]; then
            echo "Could not read current master." >&2
            exit 1
          fi
          if [ "$current" = "$SOURCE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outdated build $SOURCE_SHA; master is $current."
          fi
      - name: Configure this repository's Pages deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the checked artifact
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
